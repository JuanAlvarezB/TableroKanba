<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero Kanban</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decoración de fondo: girasoles y mariposas (solo visual, ignorada por lectores de pantalla) -->
  <div class="decor" aria-hidden="true">
    <svg width="0" height="0" class="decor-defs">
      <defs>
        <symbol id="sunflower" viewBox="0 0 100 200">
          <path d="M50 66 C 48 110, 53 150, 50 200" fill="none" stroke="#4f8a3a" stroke-width="5" stroke-linecap="round"/>
          <path d="M50 125 C 66 104, 88 108, 94 116 C 82 130, 64 134, 50 125 Z" fill="#5f9e45"/>
          <path d="M50 155 C 34 134, 12 138, 6 146 C 18 160, 36 164, 50 155 Z" fill="#5f9e45"/>
          <g fill="#f2b705">
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(15 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(45 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(75 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(105 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(135 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(165 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(195 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(225 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(255 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(285 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(315 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(345 50 50)"/>
          </g>
          <g fill="#ffd23f">
            <ellipse cx="50" cy="27" rx="7" ry="17"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(30 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(60 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(90 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(120 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(150 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(180 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(210 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(240 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(270 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(300 50 50)"/>
            <ellipse cx="50" cy="27" rx="7" ry="17" transform="rotate(330 50 50)"/>
          </g>
          <circle cx="50" cy="50" r="16" fill="#7a4a24"/>
          <circle cx="50" cy="50" r="10" fill="#4f2e14"/>
        </symbol>

        <!-- Mariposa amarilla inspirada en "Cien años de soledad".
             El amarillo de las alas se toma de la propiedad CSS "color" de cada mariposa. -->
        <symbol id="butterfly" viewBox="0 0 100 80">
          <g id="butterfly-wings" fill="currentColor" stroke="#b8860b" stroke-opacity="0.45" stroke-width="0.8">
            <path d="M50 40 C 54 22, 70 6, 90 8 C 97 9, 97 20, 92 28 C 86 38, 68 42, 50 42 Z"/>
            <path d="M50 43 C 66 42, 84 48, 84 60 C 84 72, 70 77, 60 70 C 54 66, 51 54, 50 46 Z"/>
            <circle cx="73" cy="24" r="2.4" fill="#e09a00" stroke="none" opacity="0.75"/>
            <circle cx="70" cy="58" r="1.8" fill="#e09a00" stroke="none" opacity="0.55"/>
          </g>
          <use href="#butterfly-wings" transform="matrix(-1 0 0 1 100 0)"/>
          <ellipse cx="50" cy="44" rx="2" ry="13" fill="#6b4a12"/>
          <path d="M49.5 32 Q 45 20 41 13 M50.5 32 Q 55 20 59 13" fill="none" stroke="#6b4a12" stroke-width="1" stroke-linecap="round"/>
          <circle cx="41" cy="13" r="1.4" fill="#6b4a12"/>
          <circle cx="59" cy="13" r="1.4" fill="#6b4a12"/>
        </symbol>
      </defs>
    </svg>

    <!-- Girasoles que recorren el borde inferior. Los que llevan "visitor" reciben
         una mariposa que llega volando, se posa en la flor, viaja con ella y despega. -->
    <div class="flower s1">
      <div class="flower-sway">
        <svg class="sunflower"><use href="#sunflower"/></svg>
        <div class="visitor">
          <svg class="visitor-flying"><use href="#butterfly"/></svg>
          <svg class="visitor-resting"><use href="#butterfly"/></svg>
        </div>
      </div>
    </div>
    <div class="flower s2">
      <div class="flower-sway">
        <svg class="sunflower"><use href="#sunflower"/></svg>
      </div>
    </div>
    <div class="flower s3">
      <div class="flower-sway">
        <svg class="sunflower"><use href="#sunflower"/></svg>
        <div class="visitor">
          <svg class="visitor-flying"><use href="#butterfly"/></svg>
          <svg class="visitor-resting"><use href="#butterfly"/></svg>
        </div>
      </div>
    </div>
    <div class="flower s4">
      <div class="flower-sway">
        <svg class="sunflower"><use href="#sunflower"/></svg>
        <div class="visitor">
          <svg class="visitor-flying"><use href="#butterfly"/></svg>
          <svg class="visitor-resting"><use href="#butterfly"/></svg>
        </div>
      </div>
    </div>

    <!-- Enjambre de mariposas amarillas: posición (--x, --y), tamaño (--size),
         tono (--tone) y desfase de vuelo (--delay) de cada una -->
    <svg class="butterfly" style="--x: 3%; --y: 10%; --size: 48px; --tone: #ffd60a; --delay: 0s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 8%; --y: 4%; --size: 30px; --tone: #ffe14d; --delay: -2s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 12%; --y: 18%; --size: 36px; --tone: #f9c80e; --delay: -5s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 2%; --y: 34%; --size: 40px; --tone: #ffeb7a; --delay: -7s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 9%; --y: 48%; --size: 28px; --tone: #ffd60a; --delay: -3s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 5%; --y: 62%; --size: 34px; --tone: #f9c80e; --delay: -9s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 25%; --y: 1%; --size: 26px; --tone: #ffe14d; --delay: -4s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 48%; --y: 0%; --size: 30px; --tone: #ffd60a; --delay: -6s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 70%; --y: 2%; --size: 24px; --tone: #ffeb7a; --delay: -1s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 86%; --y: 6%; --size: 44px; --tone: #f9c80e; --delay: -8s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 93%; --y: 20%; --size: 32px; --tone: #ffd60a; --delay: -2.5s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 88%; --y: 36%; --size: 38px; --tone: #ffe14d; --delay: -6.5s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 95%; --y: 50%; --size: 26px; --tone: #f7b801; --delay: -4.5s;"><use href="#butterfly"/></svg>
    <svg class="butterfly" style="--x: 90%; --y: 64%; --size: 30px; --tone: #ffd60a; --delay: -10s;"><use href="#butterfly"/></svg>
  </div>

  <div class="container">
    <h1>Tablero Kanban</h1>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Escribe una nueva tarea..." autocomplete="off">
      <button type="submit">Agregar</button>
    </form>

    <p id="board-notice" class="notice hidden" role="status"></p>

    <div class="board">
      <section class="column" data-status="pending">
        <header class="column-header">
          <h2>Pendiente</h2>
          <span class="column-count" data-count="pending">0</span>
        </header>
        <ul class="task-list" data-status="pending"></ul>
      </section>

      <section class="column" data-status="in-progress">
        <header class="column-header">
          <h2>En curso</h2>
          <span class="column-count" data-count="in-progress">0</span>
        </header>
        <ul class="task-list" data-status="in-progress"></ul>
      </section>

      <section class="column" data-status="completed">
        <header class="column-header">
          <h2>Completada</h2>
          <span class="column-count" data-count="completed">0</span>
        </header>
        <ul class="task-list" data-status="completed"></ul>
        <button id="clear-completed" class="column-action">Borrar completadas</button>
      </section>
    </div>

    <p id="all-done-message" class="hidden">✅ ¡Todas las tareas fueron finalizadas!</p>

    <div class="footer">
      <span id="task-count">0 tareas pendientes</span>
      <span class="hint">Arrastra las tarjetas o usa las flechas para moverlas</span>
    </div>

    <footer class="site-footer">
      Creado para <strong>Ari</strong> · <time datetime="2026-09-30">30 de septiembre de 2026</time>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>

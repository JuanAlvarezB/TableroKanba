<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio · LUCAS</title>
  <link rel="icon" href="husky.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lucas.css">
</head>
<body class="lucas-home auth-pending">
  <!-- Visible solo hasta confirmar la sesión (auth.js); si no hay conexión muestra Reintentar -->
  <div id="auth-screen" class="auth-screen" role="status" aria-live="polite">
    <p>Cargando…</p>
  </div>

  <div class="app-content">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="LUCAS, inicio">
        <span class="brand-mark" aria-hidden="true"><img src="husky.svg" alt=""></span>
        <span class="brand-name">LUCAS</span>
      </a>
      <div class="topbar-end">
        <span id="env-badge" class="env-badge" hidden>DESARROLLO</span>
        <div id="account"></div>
      </div>
    </header>

    <main class="home-main">
      <h1>Hola, <span id="user-name"></span></h1>
      <p class="home-intro">¿Qué quieres organizar hoy?</p>

      <!-- Solo se listan funciones reales; las nuevas se agregan como otra tarjeta -->
      <section aria-labelledby="functions-heading">
        <h2 id="functions-heading">Tus funciones</h2>
        <article class="function-card">
          <svg class="function-icon" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="5" y="7" width="11" height="34" rx="3" fill="currentColor" opacity=".24"/>
            <rect x="19" y="7" width="11" height="34" rx="3" fill="currentColor" opacity=".55"/>
            <rect x="33" y="7" width="10" height="34" rx="3" fill="currentColor"/>
          </svg>
          <div class="function-copy">
            <h3>Tablero de tareas</h3>
            <p>Organiza y consulta tus tareas.</p>
          </div>
          <a class="open-function" href="tablero.html">Abrir tablero <span aria-hidden="true">→</span></a>
        </article>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="cuenta.js"></script>
  <script src="inicio.js"></script>
</body>
</html>

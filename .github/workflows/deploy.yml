# Despliega el tablero Kanban en GitHub Pages en cada push a la rama main.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos mínimos necesarios para publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos; si llega un push nuevo, cancela el anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar la carpeta del sitio
        # Solo se publican los archivos de la app, no la configuración del repositorio
        # Cada despliegue añade el commit a las rutas de config.js, script.js y style.css
        # (script.js?v=abc1234), así los navegadores como Safari no siguen usando
        # la versión anterior guardada en su caché.
        run: |
          mkdir _site
          cp index.html config.js script.js style.css _site/
          VERSION="${GITHUB_SHA::7}"
          sed -i -e "s|src=\"config.js\"|src=\"config.js?v=${VERSION}\"|" \
                 -e "s|src=\"script.js\"|src=\"script.js?v=${VERSION}\"|" \
                 -e "s|href=\"style.css\"|href=\"style.css?v=${VERSION}\"|" _site/index.html
          grep -q "config.js?v=${VERSION}" _site/index.html
          grep -q "script.js?v=${VERSION}" _site/index.html
          grep -q "style.css?v=${VERSION}" _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

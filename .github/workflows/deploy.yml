# Despliega el tablero Kanban en GitHub Pages en cada push a la rama main.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos mínimos necesarios para publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos; si llega un push nuevo, cancela el anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        # vite build genera dist/ con index.html (inicio de LUCAS), tablero.html y login.html.
        # Los .js y .css llevan un hash de su contenido en el nombre (script-abc123.js), así
        # los navegadores como Safari nunca siguen usando una versión anterior de su caché.
        # La configuración de Firebase sale de las variables del repositorio (Settings →
        # Secrets and variables → Actions → Variables; ver .env.example). Si falta alguna,
        # vite.config.js detiene el build.
        env:
          VITE_FIREBASE_DEV_API_KEY: ${{ vars.VITE_FIREBASE_DEV_API_KEY }}
          VITE_FIREBASE_DEV_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_DEV_AUTH_DOMAIN }}
          VITE_FIREBASE_DEV_PROJECT_ID: ${{ vars.VITE_FIREBASE_DEV_PROJECT_ID }}
          VITE_FIREBASE_DEV_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_DEV_STORAGE_BUCKET }}
          VITE_FIREBASE_DEV_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_DEV_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_DEV_APP_ID: ${{ vars.VITE_FIREBASE_DEV_APP_ID }}
          VITE_FIREBASE_PDN_API_KEY: ${{ vars.VITE_FIREBASE_PDN_API_KEY }}
          VITE_FIREBASE_PDN_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_PDN_AUTH_DOMAIN }}
          VITE_FIREBASE_PDN_PROJECT_ID: ${{ vars.VITE_FIREBASE_PDN_PROJECT_ID }}
          VITE_FIREBASE_PDN_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_PDN_STORAGE_BUCKET }}
          VITE_FIREBASE_PDN_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_PDN_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_PDN_APP_ID: ${{ vars.VITE_FIREBASE_PDN_APP_ID }}
        run: npm run build

      - name: Comprobar el sitio
        # Las tres páginas existen, cada recurso que piden está en el sitio (si no, daría 404
        # en PDN) y el bundle lleva el proyecto de Firebase de PDN.
        run: |
          for page in index.html tablero.html login.html; do
            test -f "dist/${page}" || { echo "Falta ${page}"; exit 1; }
          done
          for ref in $(grep -ohE "(src|href)=\"\./[^\"]+\"" dist/*.html | sed -E 's/.*"\.\/(.*)"/\1/' | sort -u); do
            test -f "dist/${ref}" || { echo "Falta ${ref} en el sitio"; exit 1; }
          done
          grep -q "tablero-kanban-76c61" dist/assets/*.js || { echo "Falta la configuración de PDN"; exit 1; }

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

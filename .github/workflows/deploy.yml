# Despliega el tablero Kanban en GitHub Pages en cada push a la rama main.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos mínimos necesarios para publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos; si llega un push nuevo, cancela el anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar la carpeta del sitio
        # Solo se publican los archivos de la app, no la configuración del repositorio:
        # index.html (inicio de LUCAS), tablero.html (tablero de tareas), login.html y sus
        # recursos. Cada despliegue añade el commit a las rutas .js y .css de cada página
        # (script.js?v=abc1234), así los navegadores como Safari no siguen usando
        # la versión anterior guardada en su caché.
        run: |
          mkdir _site
          cp index.html tablero.html login.html \
             config.js auth.js cuenta.js inicio.js script.js login.js \
             lucas.css style.css login.css husky.svg _site/
          VERSION="${GITHUB_SHA::7}"
          sed -i -E "s#(src|href)=\"([a-z-]+\.(js|css))\"#\1=\"\2?v=${VERSION}\"#g" _site/*.html
          # Ninguna página puede quedar con un .js o .css sin versión, y cada recurso que
          # una página pide tiene que existir en el sitio (si no, daría 404 en PDN).
          if grep -nE "(src|href)=\"[a-z-]+\.(js|css)\"" _site/*.html; then
            echo "Hay recursos sin versión"; exit 1
          fi
          for ref in $(grep -ohE "(src|href)=\"[a-z-]+\.(js|css|svg|html)" _site/*.html | sed -E 's/.*"//' | sort -u); do
            test -f "_site/${ref}" || { echo "Falta ${ref} en el sitio"; exit 1; }
          done
          grep -q "auth.js?v=${VERSION}" _site/index.html
          grep -q "script.js?v=${VERSION}" _site/tablero.html
          grep -q "login.js?v=${VERSION}" _site/login.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

# Revisa cada Pull Request hacia main antes del merge: el nombre de la rama (rama), formato, lint, pruebas
# y build (revisar), las reglas de Firestore en el emulador (reglas) y la ruta crítica de punta a punta con
# Playwright contra los emuladores (e2e).
# No despliega nada; el despliegue lo hace deploy.yml al hacer merge en main.
name: Revisar el código

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Si llega un push nuevo al mismo PR, cancela la revisión anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rama:
    # Prefijos permitidos (docs/PLAN_AMBIENTES.md, C.3 y P-3). Los rulesets de GitHub no validan nombres de
    # rama fuera de Enterprise. El nombre lo controla quien abre el PR: llega por variable de entorno y se
    # compara en bash, nunca interpolado en el script. No necesita el código ni permisos.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Nombre de la rama
        env:
          RAMA: ${{ github.head_ref }}
        run: |
          PERMITIDA='^(feature|fix|docs|chore)/[a-z0-9][a-z0-9.-]*$|^ambientes-[a-z0-9][a-z0-9-]*$|^[0-9]+-[a-z0-9][a-z0-9-]*$|^revert-[0-9]+-.+$'
          if [[ "$RAMA" =~ $PERMITIDA ]]; then
            echo "✔ La rama '${RAMA}' tiene un prefijo permitido."
            exit 0
          fi
          echo "::error::La rama '${RAMA}' no tiene un prefijo permitido."
          echo "Usa minúsculas, guiones y uno de estos prefijos: feature/, fix/, docs/, chore/, ambientes-,"
          echo "<número de PBI>- (por ejemplo 226-panel-permisos) o revert-<n>- (el botón Revert de GitHub)."
          echo "Para renombrarla: git branch -m <nuevo-nombre>, git push -u origin <nuevo-nombre> y abre el PR de nuevo."
          exit 1

  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Pruebas (Vitest)
        run: npm test

      - name: Build (Vite)
        # Mismas variables que deploy.yml (ver .env.example); si falta alguna, el build falla.
        env:
          VITE_FIREBASE_DEV_API_KEY: ${{ vars.VITE_FIREBASE_DEV_API_KEY }}
          VITE_FIREBASE_DEV_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_DEV_AUTH_DOMAIN }}
          VITE_FIREBASE_DEV_PROJECT_ID: ${{ vars.VITE_FIREBASE_DEV_PROJECT_ID }}
          VITE_FIREBASE_DEV_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_DEV_STORAGE_BUCKET }}
          VITE_FIREBASE_DEV_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_DEV_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_DEV_APP_ID: ${{ vars.VITE_FIREBASE_DEV_APP_ID }}
          VITE_FIREBASE_QA_API_KEY: ${{ vars.VITE_FIREBASE_QA_API_KEY }}
          VITE_FIREBASE_QA_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_QA_AUTH_DOMAIN }}
          VITE_FIREBASE_QA_PROJECT_ID: ${{ vars.VITE_FIREBASE_QA_PROJECT_ID }}
          VITE_FIREBASE_QA_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_QA_STORAGE_BUCKET }}
          VITE_FIREBASE_QA_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_QA_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_QA_APP_ID: ${{ vars.VITE_FIREBASE_QA_APP_ID }}
          VITE_FIREBASE_PDN_API_KEY: ${{ vars.VITE_FIREBASE_PDN_API_KEY }}
          VITE_FIREBASE_PDN_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_PDN_AUTH_DOMAIN }}
          VITE_FIREBASE_PDN_PROJECT_ID: ${{ vars.VITE_FIREBASE_PDN_PROJECT_ID }}
          VITE_FIREBASE_PDN_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_PDN_STORAGE_BUCKET }}
          VITE_FIREBASE_PDN_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_PDN_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_PDN_APP_ID: ${{ vars.VITE_FIREBASE_PDN_APP_ID }}
        run: npm run build

  reglas:
    # Prueba firestore.rules en el emulador con el proyecto ficticio demo-lucas: sin variables,
    # secretos ni credenciales, y sin conexión con Desarrollo ni PDN (docs/PLAN_USUARIOS.md, 1.8).
    # Va aparte de revisar para exigirlo por separado en el ruleset de main.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java (el emulador de Firestore pide JDK 21 o superior)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        # firebase-tools sale de package-lock.json, con versión exacta.
        run: npm ci

      - name: Pruebas de reglas (emulador de Firestore)
        run: npm run test:rules

  e2e:
    # Ruta crítica con Playwright contra los emuladores de Auth y Firestore, con el proyecto ficticio
    # demo-lucas (docs/PLAN_AMBIENTES.md, E.3): sin variables, secretos ni credenciales, igual en PR de ramas
    # sin acceso a secretos. Después de revisar: primero lo barato.
    needs: revisar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java (los emuladores piden JDK 21 o superior)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Lint de las pruebas (ESLint, Prettier, tipos y nombres)
        run: npm run lint:acceptance

      - name: Pruebas end-to-end (Playwright y emuladores)
        run: npm run test:e2e

      - name: Subir el reporte si falló
        # Capturas, video y traza de cada prueba fallida. Solo contienen datos ficticios del emulador.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
